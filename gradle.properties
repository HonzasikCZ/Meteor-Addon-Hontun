org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
# MUSÍ být false: loomův setup mapování pro neobfuskovanou 26.x není kompatibilní s
# konfigurační cache -> jinak zůstane 'mappings' konfigurace prázdná ("has no dependencies").
# Všechny funkční 26.2 Meteor addony (i template) to mají false.
org.gradle.configuration-cache=false

# Fabric Properties (https://fabricmc.net/develop)
# 26.x je DEOBFUSKOVANÁ -> žádný mappings() se nedeklaruje (viz build.gradle.kts).
minecraft_version=26.2
loader_version=0.19.3

# Mod Properties
mod_version=1.0.1
maven_group=cz.honzasik
archives_base_name=hontun
